name: storyboard-test

# Renders one storyboard's shots into a silent rough cut for the owner to
# watch. BILLABLE (~$1 per 8-shot board at the Sept 2026 discount). Manual only;
# never posts, never commits.
on:
  workflow_dispatch:
    inputs:
      story:
        description: "Storyboard id in data/storyboards.json"
        default: "before_breakfast"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Render storyboard
        env:
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
        run: python scripts/render_storyboard.py "${{ github.event.inputs.story }}" out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storyboard-${{ github.event.inputs.story }}
          path: |
            out/*.mp4
            out/report.txt
          if-no-files-found: ignore
