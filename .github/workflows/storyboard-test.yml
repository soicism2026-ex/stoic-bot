name: storyboard-test

# Renders one storyboard's shots into a silent rough cut for the owner to
# watch. BILLABLE (~$1 per 8-shot board at the Sept 2026 discount). Manual only;
# never posts, never commits.
on:
  workflow_dispatch:
    inputs:
      story:
        description: "Storyboard id in data/storyboards.json"
        default: "before_breakfast"
      stills:
        description: "1 = free Cloudflare stills instead of paid Higgsfield video"
        default: "1"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Render storyboard
        env:
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python scripts/render_storyboard.py "${{ github.event.inputs.story }}" out \
            $([ "${{ github.event.inputs.stills }}" = "1" ] && echo --stills)
          python scripts/review_shots.py out out/review.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storyboard-${{ github.event.inputs.story }}
          path: |
            out/*.mp4
            out/report.txt
            out/review.png
          if-no-files-found: ignore
