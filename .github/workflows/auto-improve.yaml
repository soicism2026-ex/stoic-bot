name: Channel report (advisory)

# Rebuilt from the old auto-improve loop. The old version let Claude Code Action
# rewrite the repo and commit to main unreviewed — it twice broke live posting.
# This version is ADVISORY ONLY: it pulls analytics, runs the channel analyst,
# and commits a human-readable report to data/channel_report.md. It never edits
# code, never touches the posting pipeline, and applies no changes. YOU read the
# report (or ask Claude for it on demand) and decide what to change.

on:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC — report only, safe to run
  workflow_dispatch: {}

permissions:
  contents: write          # only to commit the report file

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the analyst sees all of posts.csv

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Pull latest analytics
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python src/analytics.py || echo "analytics pull failed — reporting on existing data"

      - name: Pull retention (no-op until yt-analytics scope is granted)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/retention.py || echo "retention not enabled yet"

      - name: Generate channel report
        run: |
          python scripts/channel_report.py --write
          echo "=== report preview ==="
          head -40 data/channel_report.md

      - name: Commit report (report file only — never code)
        run: |
          git config user.name "stoic-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/channel_report.md data/analytics.csv data/retention.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "report: weekly channel report [skip ci]"
          git push
