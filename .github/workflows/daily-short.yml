name: daily-short

on:
  schedule:
    # Target 3 videos/day (MAX_POSTS_PER_DAY caps it). GitHub Actions SILENTLY
    # DROPS scheduled runs under load, so we over-provision 6 trigger slots as
    # redundancy — the daily cap ensures only 3 actually post (extra runs hit
    # the guard and skip). Spread across the clock to catch peak hours in every
    # region and to survive whichever runs GitHub decides to drop.
    - cron: "0 3 * * *"
    - cron: "0 7 * * *"
    - cron: "0 11 * * *"
    - cron: "0 15 * * *"
    - cron: "0 19 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      max_posts:
        description: "Daily post cap for THIS run (raise it to force a review post past the 3/day cadence)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

# GitHub delivers backed-up scheduled runs in bursts — on 2026-08-06 two fired
# 6 seconds apart. Two pipelines running at once both read posts.csv BEFORE
# either commits, so both see "2 posts today" and both publish: the 3/day cap
# silently becomes 4. Serialising the workflow makes the daily guard read
# committed state, and removes the posts.csv push race at the same time.
# cancel-in-progress is false — never kill a run that may be mid-upload.
concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # A normal run is ~5 min; a QA-retry-heavy one ~30. Anything past an hour is
    # hung, and without this it would sit burning a runner for 6 hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg + fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Validate secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/check_secrets.py

      # SELF-HOSTED VOICE — OFF by default since 2026-08-07. Chatterbox is
      # free and benchmarked (~99s/post on this runner), but the owner rejected
      # its stock voice outright, and a cheaper voice nobody wants to listen to
      # is not cheaper. Set the repository variable CHATTERBOX_LOCAL=1 to turn
      # it back on — worth doing once a cloned reference voice exists, since
      # that is what fixes the casting rather than the processing.
      # Every install step below is continue-on-error: a broken torch wheel
      # must degrade the VOICE, never stop the post.
      - name: Cache Chatterbox weights
        # format() forces a STRING comparison. Without it this is a trap:
        # GitHub casts operands to numbers when their types differ, so an
        # unset variable (null -> 0) compares EQUAL to the string '0', and
        # `vars.X != '0'` is false when the variable does not exist. That
        # silently skipped this step and left the $0 voice switched off while
        # every other signal said it was on.
        if: ${{ format('{0}', vars.CHATTERBOX_LOCAL) == '1' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-v1

      - name: Install self-hosted voice deps
        # format() forces a STRING comparison. Without it this is a trap:
        # GitHub casts operands to numbers when their types differ, so an
        # unset variable (null -> 0) compares EQUAL to the string '0', and
        # `vars.X != '0'` is false when the variable does not exist. That
        # silently skipped this step and left the $0 voice switched off while
        # every other signal said it was on.
        if: ${{ format('{0}', vars.CHATTERBOX_LOCAL) == '1' }}
        continue-on-error: true
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-voice.txt

      # The story bank is hand-edited JSON and its words publish verbatim,
      # unreviewed by any other stage. A typo in a citation is a misattributed
      # quote, which is the one failure this channel has said it cannot
      # survive. Runs BEFORE the post, and blocks it.
      - name: Validate story bank
        run: python scripts/validate_stories.py

      - name: Run self-healing post pipeline
        env:
          # Cadence is 1/day since 2026-08-25. Owner: "we need to bring
          # quality back." Three near-identical uploads a day was also the
          # worst possible exposure to YouTube's inauthentic-content test,
          # which asks whether videos "feel interchangeable when a viewer
          # watches several in a row from the same channel" — and it split a
          # tiny audience across three impressions. One hand-written story a
          # day is worth a week of "Stand unshaken."
          # `inputs` is empty on a schedule, so this falls through to "1". A
          # manual run can pass a higher number. Deliberately a STRING passed
          # straight through — comparing an unset input against a
          # numeric-looking value is the null-casts-to-0 trap that silently
          # disabled the voice steps on 2026-08-07.
          MAX_POSTS_PER_DAY: ${{ inputs.max_posts || '1' }}
          # In-process Chatterbox is the primary voice. Defaults to on; set the
          # repo variable CHATTERBOX_LOCAL=0 to fall back to Replicate/edge-tts.
          CHATTERBOX_LOCAL: ${{ vars.CHATTERBOX_LOCAL || '0' }}
          # Owner-approved pacing (sample variant B, 2026-08-06): the 0.25s
          # sentence gaps give the viewer a beat to take in the background clip.
          # Chatterbox is OFF by default (owner rejected its stock voice on
          # 2026-08-07). These stay so that flipping CHATTERBOX_LOCAL=1 with a
          # cloned reference voice restores the tuned pacing immediately.
          CHATTERBOX_EXAGGERATION: "0.45"
          CHATTERBOX_CFG_WEIGHT: "0.35"
          CHATTERBOX_SENTENCE_GAP: "0.25"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # 0 = ElevenLabs never speaks. Two reasons: the key has been 401ing
          # for weeks, and more importantly a third voice appearing on the
          # first post of each day would CONTAMINATE the Steffan/Christopher
          # A/B the owner just asked for — those posts would carry a different
          # voice while being attributed to the rotation. Raise it only after
          # the A/B has a verdict, and only if the key is fixed.
          ELEVENLABS_POSTS_PER_DAY: "0"
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Instagram cross-post (optional — pipeline skips if unset).
          # IG_ACCESS_TOKEN: long-lived token for an IG Professional account.
          # IG_USER_ID: the Instagram Business account id (numeric).
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          # Product promo — edit these to update copy without touching code.
          # Set PROMO_ENABLED to "0" to disable all promo behaviour.
          PROMO_ENABLED: "1"
          PROMO_PRODUCT_NAME: "The Stoic Reset"
          PROMO_URL: "https://soicism.gumroad.com/l/cslosv"
          PROMO_COMMENT: "1"
          # PROMO_CTA_VARIATIONS: pipe-delimited (|) list of 3-5 CTA strings.
          # Leave unset to use the three built-in defaults from src/promo.py.
          # GENERATED BACKGROUNDS — OFF since 2026-08-25. They are AI STILLS
          # with a slow zoom; before them every background was real stock
          # VIDEO. Comparing day-3 views (same age for every video):
          #
          #   stock video, 10 Jul - 6 Aug : n=82  median 217
          #   AI stills,   7 Aug onward   : n=44  median  58   (3.8x lower)
          #   Mann-Whitney z = 5.1 — not chance
          #
          # Day-level data is noisier (5-6 Aug were already weak), so this is
          # association, not a proven single cause. But it is the largest
          # identifiable change coinciding with the largest sustained drop,
          # and reverting costs one line. Motion is the thing Shorts reward;
          # a still that zooms is not motion.
          #
          # Set back to "1" only with a measured win, not a hunch.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REEL_IMAGE_BG: "0"
          # PRIMARY image provider — Cloudflare Workers AI (FLUX.1 schnell).
          # Free allowance is 10,000 neurons/day and a schnell image costs
          # ~43, so ~230/day are free; this channel needs 18. No watermark.
          # Tried BEFORE OpenAI, which does the same job at $22-43/month.
          # Absent secrets => generation is skipped entirely and backgrounds
          # come from stock exactly as they do today.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # PRIMARY VOICE — Chatterbox (Resemble AI, MIT) via Replicate.
          # Open source, preferred over ElevenLabs in blind tests (65% vs 25%),
          # billed per second instead of a subscription. Add the
          # REPLICATE_API_TOKEN secret to activate; without it the pipeline
          # silently uses ElevenLabs (if working) then free edge-tts.
          # Optional: CHATTERBOX_VOICE_URL = public URL of a reference clip to
          # clone a specific voice.
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: python scripts/daily_post.py

      - name: Fetch analytics
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python src/analytics.py

      # DISABLED 2026-08-13. The goal is YPP: 3,000,000 VALID PUBLIC Shorts
      # views in 90 days. Unlisting a video removes its views from that total
      # permanently. 113 of 196 videos sit under the 300-view bar, and the
      # channel's own numbers show the damage: the per-video peak views sum to
      # 69,176 while the channel total reads 55,290 — roughly 14k views, a
      # fifth of everything ever earned, deleted from the metric being chased.
      # The theory was that hiding weak videos improves the channel's quality
      # signal. There is no evidence for it here: pruning ran throughout the
      # period in which 1-day views fell 77%. Turn it back on only after YPP is
      # reached, if ever.
      - name: Prune low-performing videos
        if: ${{ vars.PRUNE_ENABLED == '1' }}
        # Unlist under-performers older than a week. ADAPTIVE threshold: the
        # floor is 300v but the bar rises automatically as the channel improves
        # (max of 300 and 0.5x the recent median views) — the minimum keeps
        # increasing with performance. Note: unlisted views stop counting toward
        # the 3M YPP threshold.
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PRUNE_VIEW_THRESHOLD: "300"
          PRUNE_MIN_AGE_DAYS: "7"
          PRUNE_ADAPTIVE_FRACTION: "0.5"
        run: python scripts/prune_videos.py

      - name: Reply to top comments
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/reply_to_comments.py

      # RETENTION — the signal the Shorts algorithm actually ranks on, and the
      # one the content engine now learns from (_winning_hooks feeds the
      # best-retained hooks back into every generation). scripts/retention.py
      # existed since 2026-08-07 but was wired into NO workflow: it had run
      # exactly once, by hand, so the feedback loop would have recommended the
      # same six hooks forever and never learned from a new post.
      # Uses the YouTube ANALYTICS API — a separate quota from the Data API's
      # 10,000/day, so this costs nothing against uploads.
      # continue-on-error: an older refresh token may lack the
      # yt-analytics.readonly scope; the script exits cleanly in that case and
      # a missing signal must never cost a post.
      - name: Pull retention
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/retention.py

      # Judges the OUTPUT, not the code. Every repetition bug so far (Rule 7
      # x13, one music bed x30, the same hook verbatim x3) passed the test
      # suite, because the code was right and posts.csv was wrong. Warn-only:
      # it must surface drift on the run page, never block a post.
      - name: Variety check
        continue-on-error: true
        run: python scripts/variety_check.py

      - name: Commit log and backups
        run: |
          git config user.name "stoic-bot"
          git config user.email "bot@users.noreply.github.com"
          # Never let render intermediates or >95MB files near the push —
          # GitHub hard-rejects files over 100MB and the WHOLE run fails,
          # losing the post log (this killed the 2026-07-12 22:00 slot).
          find backups -type f \( -name '*.bg*.mp4' -o -name '*.captions.ass' \
            -o -name '*.clicks.wav' -o -name '*.mixclick.m4a' -o -name '*.hook.wav' \
            -o -name '*.mix.m4a' -o -name '*.loud.m4a' -o -size +95M \) \
            -delete 2>/dev/null || true
          git add data/posts.csv data/analytics.csv data/channel_stats.csv data/replied_comments.csv data/retention.csv QA_LOG.md backups/
          git diff --staged --quiet || git commit -m "log: $(date -u +%F) post"
          # The 4 daily slots race on pushing to main — rebase-retry instead of
          # failing the run (a lost push means a lost posts.csv row).
          for i in 1 2 3; do
            git push && break
            git pull --rebase origin main && continue
          done
