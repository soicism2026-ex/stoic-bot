name: Update content strategy

# Frontinus, the free strategist (owner 2026-10-27: "I want to fire our
# strategist find some who will do this for free before we fire though").
# Daily at 10:00 UTC he reads what is working from data the bots already keep
# (posts.csv, analytics.csv, retention.csv): views at day 3, compared with the
# edits aired the same week, plus retention. He writes data/strategy.md (the
# generated-content prompt reads it) and data/strategy.json (the edit picker
# airs winning themes first). No secrets, no paid API: the old strategist
# (scripts/strategy_loop.py, Claude Opus through the API) never produced a
# strategy because the credit ran out, and failed every day.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strategy-update
  cancel-in-progress: false

jobs:
  strategy-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read what is working (free)
        run: python scripts/strategist.py --write

      - name: Commit the read
        run: |
          git config user.name "stoic-bot"
          git config user.email "stoic-bot@users.noreply.github.com"
          git add data/strategy.md data/strategy.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "strategy: Frontinus's daily read [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
