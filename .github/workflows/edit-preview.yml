# Renders the next stoic EDIT through the full real pipeline (voice, stock
# video, free AI stills, epic music, QA) and saves it as an artifact.
# DRY_RUN: nothing is uploaded to YouTube and nothing is logged.
#
# Apelles' shifts (owner 2026-10-23: "Get them working"): twice a day it
# rehearses the NEXT post, rendered for the day it airs (src/airday.py), and
# puts it in the `up-next` release. The HQ sync carries it into the HQ's "Up
# next", so the owner can watch each Short before it goes out, and a render
# that breaks shows up hours before its slot instead of at it.
#   08:40 UTC  -> the day's second post (airs from 15:00)
#   19:40 UTC  -> tomorrow's first post (airs from 00:00)
name: edit-preview
on:
  schedule:
    - cron: "40 8 * * *"
    - cron: "40 19 * * *"
  workflow_dispatch:
    inputs:
      music:
        description: Audition an original track by id (data/edit_music.json), approved or not. Preview only.
        required: false
        default: ''
      voice:
        description: brian = the live narrator since 2026-10-21 (checks the key first, fails if Brian did not speak); steffan = the free fallback voice
        type: choice
        options: [brian, steffan]
        default: brian
      sfx:
        description: 'on = mix the ElevenLabs sound effects, as live posts do since 2026-10-22 (a preview may use unapproved ones)'
        type: choice
        options: ['on', 'off']
        default: 'on'
      up_next:
        description: Also put this render in the HQ as the next Short (scheduled runs always do)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: edit-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VOICE: ${{ inputs.voice || 'brian' }}
      # A rehearsal is a faithful copy of the live post: the same voice and
      # sounds; an audition (music input) is not, so it never goes to the HQ.
      UP_NEXT: ${{ (github.event_name == 'schedule' || inputs.up_next) && inputs.music == '' && '1' || '' }}
    steps:
    - uses: actions/checkout@v4
    - name: Install ffmpeg + fonts
      timeout-minutes: 20
      run: bash scripts/ci_install_ffmpeg.sh
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install deps
      run: pip install -r requirements.txt
    - name: Check the ElevenLabs key (prints the plan, never the key)
      if: env.VOICE == 'brian'
      env:
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      run: |
        python - <<'EOF'
        import json, os, sys, urllib.request
        sys.path[:0] = ["scripts", "src"]
        import check_secrets, tts
        check_secrets.check_elevenlabs()
        def get(path):
            req = urllib.request.Request("https://api.elevenlabs.io" + path,
                                         headers={"xi-api-key": os.environ["ELEVENLABS_API_KEY"]})
            try:
                with urllib.request.urlopen(req, timeout=15) as r:
                    return json.loads(r.read())
            except Exception as e:
                print(f"  {path}: {e}")
                return {}
        s = get("/v1/user/subscription")
        if s:
            print(f"  plan {s.get('tier')} ({s.get('status')}): "
                  f"{s.get('character_count')} of {s.get('character_limit')} characters used this month")
        v = get(f"/v1/voices/{tts._EL_VOICE_ID}")
        if v:
            print(f"  voice {tts._EL_VOICE_ID}: {v.get('name')} ({v.get('category')})")
        EOF
        # ElevenLabs' own check, as its onboarding asks. The key goes in a
        # temp file outside the checkout and is deleted straight after.
        # Manual runs only: a scheduled rehearsal has nothing to learn from it.
        if [ "${{ github.event_name }}" != schedule ]; then
          umask 077
          printf 'ELEVENLABS_API_KEY=%s\n' "$ELEVENLABS_API_KEY" > "$RUNNER_TEMP/el.env"
          npx -y @elevenlabs/cli@latest onboard check --env-path "$RUNNER_TEMP/el.env" || true
          rm -f "$RUNNER_TEMP/el.env"
        fi
    - name: The day the next post airs
      run: |
        day=$(python src/airday.py --next)
        echo "REEL_TODAY=$day" >> "$GITHUB_ENV"
        echo "rendering for $day"
    - name: 'Render the next edit (DRY_RUN: no upload, no log)'
      env:
        MAX_POSTS_PER_DAY: '99'
        CHATTERBOX_LOCAL: ${{ vars.CHATTERBOX_LOCAL || '0' }}
        CHATTERBOX_EXAGGERATION: '0.45'
        CHATTERBOX_CFG_WEIGHT: '0.35'
        CHATTERBOX_SENTENCE_GAP: '0.25'
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        ELEVENLABS_POSTS_PER_DAY: '0'
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
        REEL_KLING_BG: ${{ vars.REEL_KLING_BG }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PROMO_ENABLED: '1'
        PROMO_PRODUCT_NAME: The Stoic Reset
        PROMO_URL: https://soicism.gumroad.com/l/cslosv
        PROMO_COMMENT: '0'
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        REEL_IMAGE_BG: '1'
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        DRY_RUN: '1'
        REEL_FORMAT: edit
        REEL_EDIT_MUSIC: ${{ inputs.music }}
        REEL_EDIT_SFX: ${{ (inputs.sfx || 'on') == 'on' && '1' || '0' }}
      run: |
        if [ "$VOICE" = brian ]; then
          # Nothing ahead of ElevenLabs in the voice chain may speak, and the
          # live once-a-day allocation must not block a preview.
          export ELEVENLABS_POSTS_PER_DAY=99 CHATTERBOX_LOCAL=0 REPLICATE_API_TOKEN=
        fi
        python scripts/daily_post.py
    - name: Confirm Brian actually spoke
      if: env.VOICE == 'brian'
      run: |
        spoke=$(cat data/preview/voice.txt 2>/dev/null || echo none)
        echo "voice that spoke: $spoke"
        if [ "$spoke" != Brian ]; then
          echo "::error::ElevenLabs did not speak (got $spoke). The render log above has the ElevenLabs error."
          exit 1
        fi
    - name: Put it in the HQ as the next Short
      if: env.UP_NEXT == '1'
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: python scripts/up_next.py publish data/preview
    - name: Review sheet
      if: always()
      run: python scripts/review_shots.py data/preview data/preview/review.png || true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: edit-preview-${{ inputs.voice || 'brian' }}
        path: data/preview/
        if-no-files-found: ignore
