# ONE-OFF (2026-10-12): assisted posting was retired (owner: "too much of a
# hassle"). Deletes the edit-* video releases it left behind. Delete this file
# once it has run.
name: retire-assist
on:
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
    - name: Delete leftover assisted-posting releases
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        gh release list --limit 200 --json tagName --jq '.[].tagName' | grep '^edit-' | while read -r tag; do
          gh release delete "$tag" --yes --cleanup-tag && echo "deleted $tag"
        done
        echo "remaining releases:"; gh release list --limit 20
