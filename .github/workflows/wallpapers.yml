# Wallpaper packs for Gumroad (owner 2026-11-13). Manual only: never scheduled.
# Paints one pack (one philosopher x one screen) with the channel's free
# Cloudflare FLUX painter, sets the verified quotes over it, zips it and puts
# the zip + cover + manifest in the `wallpapers` release. See docs/wallpapers.md.
# BUDGET: the painter shares Cloudflare's free 10,000 neurons a day with the
# daily posts (they paint before 20:00 UTC), so run after 20:00 UTC or tick force.
name: Wallpaper pack
on:
  workflow_dispatch:
    inputs:
      pack:
        description: Whose quotes
        type: choice
        options: [marcus, seneca, epictetus]
        default: marcus
      size:
        description: Which screen
        type: choice
        options: [phone, desktop]
        default: phone
      limit:
        description: How many wallpapers (up to 10)
        default: '10'
      force:
        description: Paint before 20:00 UTC (spends the daily posts' free neurons)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: wallpapers
  cancel-in-progress: false
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - name: Install ffmpeg + fonts
      timeout-minutes: 20
      run: bash scripts/ci_install_ffmpeg.sh
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install deps
      run: pip install -r requirements.txt "pillow>=10,<13"
    - name: Stills already painted (shared with the Shorts)
      uses: actions/cache@v4
      with:
        path: data/still_cache
        key: stills-${{ github.run_id }}
        restore-keys: |
          stills-
    - name: Paint the pack
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        REEL_STILL_CACHE: data/still_cache
        PACK: ${{ inputs.pack }}
        SIZE: ${{ inputs.size }}
        LIMIT: ${{ inputs.limit }}
        FORCE: ${{ inputs.force && '--force' || '' }}
      run: python scripts/wallpapers.py render --pack "$PACK" --size "$SIZE" --limit "$LIMIT" --out wallpapers_out $FORCE
    - name: Zip it and make the cover
      env:
        PACK: ${{ inputs.pack }}
        SIZE: ${{ inputs.size }}
      run: python scripts/wallpapers.py package --pack "$PACK" --size "$SIZE" --out wallpapers_out
    - name: Put it in the wallpapers release
      env:
        PACK: ${{ inputs.pack }}
        SIZE: ${{ inputs.size }}
      run: python scripts/wallpapers.py publish --pack "$PACK" --size "$SIZE" --out wallpapers_out
    - name: Cover as an artifact
      uses: actions/upload-artifact@v4
      with:
        name: wallpapers-${{ inputs.pack }}-${{ inputs.size }}-cover
        path: wallpapers_out/${{ inputs.pack }}-${{ inputs.size }}-cover.jpg
        if-no-files-found: error
