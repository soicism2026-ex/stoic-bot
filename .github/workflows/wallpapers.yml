# Wallpaper packs for Gumroad (owner 2026-11-13). Manual only: never scheduled.
# Paints one pack (one philosopher x one screen) with the channel's free
# Cloudflare FLUX painter, sets the verified quotes over it, zips it and puts
# the zip + cover + manifest in the `wallpapers` release. See docs/wallpapers.md.
# BUDGET: the painter shares Cloudflare's free 10,000 neurons a day with the
# daily posts (they paint before 20:00 UTC), so run after 20:00 UTC or tick force.
name: Wallpaper pack
on:
  schedule:
    - cron: "33 20 * * *"    # one queued pack a night, after the day's posts and rehearsals have painted
  workflow_dispatch:
    inputs:
      pack:
        description: Which pack (next = the next in data/wallpapers_queue.json)
        type: choice
        options: [next, marcus, seneca, epictetus]
        default: next
      size:
        description: phone (1170x2532) or desktop (3840x2160); ignored for "next"
        type: choice
        options: [phone, desktop]
        default: phone
      limit:
        description: Quotes per pack
        default: '10'
      force:
        description: Paint before 20:00 UTC (eats into the posts' free painting allowance)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: wallpapers
  cancel-in-progress: false
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - name: Install ffmpeg + fonts
      timeout-minutes: 20
      run: bash scripts/ci_install_ffmpeg.sh
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install deps
      run: pip install -r requirements.txt "pillow>=10,<13"
    - name: Stills already painted (shared with the Shorts)
      uses: actions/cache@v4
      with:
        path: data/still_cache
        key: stills-${{ github.run_id }}
        restore-keys: |
          stills-
    - name: Which pack
      id: which
      env:
        PACK: ${{ inputs.pack }}
        SIZE: ${{ inputs.size }}
        LIMIT: ${{ inputs.limit }}
      run: |
        if [ -n "$PACK" ] && [ "$PACK" != "next" ]; then
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"; echo "size=$SIZE" >> "$GITHUB_OUTPUT"; echo "limit=${LIMIT:-10}" >> "$GITHUB_OUTPUT"
        else
          python scripts/wallpapers.py queue
        fi
    - name: Paint the pack
      if: steps.which.outputs.pack != ''
      id: paint
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        REEL_STILL_CACHE: data/still_cache
        PACK: ${{ steps.which.outputs.pack }}
        SIZE: ${{ steps.which.outputs.size }}
        LIMIT: ${{ steps.which.outputs.limit }}
        FORCE: ${{ inputs.force && '--force' || '' }}
      run: python scripts/wallpapers.py render --pack "$PACK" --size "$SIZE" --limit "$LIMIT" --out wallpapers_out $FORCE
    - name: Zip it and make the cover
      if: steps.which.outputs.pack != ''
      env:
        PACK: ${{ steps.which.outputs.pack }}
        SIZE: ${{ steps.which.outputs.size }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: python scripts/wallpapers.py package --pack "$PACK" --size "$SIZE" --out wallpapers_out
    - name: The pack, private (a workflow artifact only the owner can download)
      if: steps.which.outputs.pack != ''
      uses: actions/upload-artifact@v4
      with:
        name: wallpapers-${{ steps.which.outputs.pack }}-${{ steps.which.outputs.size }}
        path: wallpapers_out/${{ steps.which.outputs.pack }}-${{ steps.which.outputs.size }}.zip
        if-no-files-found: error
        retention-days: 90
    - name: The cover and the manifest, public (the wallpapers release, for the HQ)
      if: steps.which.outputs.pack != ''
      env:
        GH_TOKEN: ${{ github.token }}
        PACK: ${{ steps.which.outputs.pack }}
        SIZE: ${{ steps.which.outputs.size }}
      run: python scripts/wallpapers.py publish --pack "$PACK" --size "$SIZE" --out wallpapers_out
    - name: Record the pack; a finished one leaves the queue
      if: steps.which.outputs.pack != ''
      env:
        PACK: ${{ steps.which.outputs.pack }}
        SIZE: ${{ steps.which.outputs.size }}
        COMPLETE: ${{ steps.paint.outputs.complete }}
        FROM_QUEUE: ${{ inputs.pack == '' || inputs.pack == 'next' }}
      run: |
        if [ "$COMPLETE" = "1" ] && [ "$FROM_QUEUE" = "true" ]; then python scripts/wallpapers.py queue --pop "$PACK" "$SIZE"; fi
        git config user.name "stoic-bot" && git config user.email "bot@users.noreply.github.com"
        git add data/wallpapers_queue.json data/wallpapers.json
        git commit -m "wallpapers: $PACK $SIZE pack painted" || exit 0
        for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break || sleep 5; done
